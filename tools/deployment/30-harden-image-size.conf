[Service]
# Preloads /opt/meshcentral/bin/harden-image-size.js before meshcentral.js so that
# image-size's unpatched ICNS/JXL/HEIF parsers (GHSA-w3rx-r6r6-pgpr,
# GHSA-5p2g-fcmc-qvqq — no fixed release upstream) are disabled at runtime.
# See the header comment in that file for rationale and removal instructions.
Environment="NODE_OPTIONS=--require /opt/meshcentral/bin/harden-image-size.js"
