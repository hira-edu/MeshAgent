name: Contracts and MeshCentral tests

# Runs the MeshAgent static contracts, the release and deploy suites that need no
# server or built binaries, and the MeshCentral wrapper tests, against a fresh
# checkout of hira-edu/MeshCentral placed beside MeshAgent.
# It never deploys, signs or releases. Its one credential is a short-lived token, minted
# from the release GitHub App, that can only read the private hook repository: the
# MeshCentral package carries the Windows agent builds pinned in agents/agent-defaults.json,
# which are stored as hook release assets, never in public git (SSOT D30 OD1 option B).

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      meshcentral_ref:
        description: 'hira-edu/MeshCentral branch, tag or commit to test against'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

env:
  MESHCENTRAL_REPOSITORY: hira-edu/MeshCentral
  # Precedence: dispatch input, then the repository variable, then main.
  MESHCENTRAL_REF: ${{ inputs.meshcentral_ref || vars.MESHCENTRAL_REF || 'main' }}
  # The fork does not carry the upstream release tags. Since Stage 6 the fork is based on
  # 1.3.1; 1.2.5 stays while the duplicate server's layout A models production (1.2.5 until
  # the cutover). Each tag is fetched from upstream and pinned to its commit, so a moved or
  # replaced upstream tag fails the job instead of changing the baseline.
  MESHCENTRAL_UPSTREAM_URL: https://github.com/Ylianst/MeshCentral.git
  MESHCENTRAL_UPSTREAM_TAGS: >-
    1.2.5=b09b1d60328de8e2d2f7387561ed51c64011c82a
    1.3.1=f436143527458d56da0336ea3047c006703fb4e4
  # Node 24 LTS, the version of upstream 1.3.1's node:24.22.1 image, which the fork adopts
  # for its 1.3.1 base (the release image and duplicate layout B). Production keeps 1.2.5 on
  # Node 20 until the cutover; nothing here runs that layout. Python matches the release
  # workflow.
  NODE_VERSION: '24.22.1'
  PYTHON_VERSION: '3.12'
  # Private repository whose releases hold the pinned Windows agent builds, one release per
  # pinned build (tools/deployment/agent_build_release.py names it from the pins).
  AGENT_BUILDS_STORE: hira-edu/hook
  TEST_TIMEOUT_SECONDS: '600'
  # Tests in this repository that this workflow does not run. One line per test:
  # "<path> | <reason>". Every path must exist, or the job fails, so a renamed or
  # deleted test cannot leave a stale entry behind. A test matched by a run pattern
  # below is reported as EXCLUDED with its reason instead of being run.
  EXCLUDED_TESTS: |
    test/service_bundle_embedding_contract.js | Needs built MeshServiceRuntime executables (meshservice/x64/MeshServiceRuntime/MeshService-2022.exe and the ARM64 one) to extract and compare the embedded service DLL. The coordinated release workflow runs it after building ("Validate embedded service DLL parity").
    test/power_action_policy_lab_runtime.js | Lab-only: reads branding_config.local.json (local identities, never committed, and must not reach CI) and the gitignored meshcore/generated/meshagent_branding.h. Its tracked-source half, test/power_action_policy_contract.js, runs here.
    test/deploy_service_host_export_runtime.py | Needs built x64 and ARM64 MeshServiceBundle DLLs (meshservice/{x64,ARM64}/MeshServiceBundle/MeshService-2022.dll). No workflow in this repository builds them, so it runs only by hand after a local bundle build (docs/testing/README.md).
    test/desktop_audio_bridge_runtime.js | Windows only: launches the built service DLL through rundll32 and captures the default render endpoint; off Windows it only prints a skip.
    test/historical_migration_runtime.js | Destructive install/update/uninstall validation; requires --approved-host on a disposable Windows host with built packages.
    test/http_request_alignment_runtime.js | Needs a built MeshAgent Windows binary (meshconsole/Release/MeshConsole64.exe) and runs it; there is no Windows build in this workflow. Run on an authorized Windows test host.
    test/kvm_blockinput_runtime.js | Needs a built Windows service agent (MeshService-2022.exe) and an interactive Windows desktop session on an authorized test host.
    test/kvm_bridge_connect_delay_runtime.js | Needs a built Windows service agent (MeshService-2022.exe) and an interactive Windows desktop session on an authorized test host.
    test/kvm_bridge_crash_recovery_runtime.js | Needs a built Windows service agent (MeshService-2022.exe) and an interactive Windows desktop session on an authorized test host.
    test/kvm_bridge_hardening_runtime.js | Needs a built Windows service agent (MeshService-2022.dll) and an interactive Windows desktop session on an authorized test host.
    test/kvm_bridge_session_change_runtime.js | Needs a built Windows service agent (MeshService-2022.exe) and an interactive Windows desktop session on an authorized test host.
    test/kvm_bridge_session_interrupt_runtime.js | Needs a built Windows service agent (MeshService-2022.exe) and an interactive Windows desktop session on an authorized test host.
    test/kvm_capture_reconnect_runtime.js | Needs a built Windows service agent (an explicit MeshConsole64.exe) and an interactive Windows desktop session on an authorized test host.
    test/kvm_elevated_input_runtime.js | Needs a built Windows service agent (MeshService-2022.exe) and an interactive Windows desktop session on an authorized test host.
    test/kvm_initial_frame_runtime.js | Needs a built Windows service agent (MeshService-2022.exe) and an interactive Windows desktop session on an authorized test host.
    test/kvm_multi_session_runtime.js | Needs a built Windows service agent (MeshService-2022.exe) and an interactive Windows desktop session on an authorized test host.
    test/kvm_system_picture_runtime.js | Needs a built Windows service agent (MeshService-2022.exe) and an interactive Windows desktop session on an authorized test host.
    test/large_file_transfer_runtime.js | Needs a built MeshAgent Windows binary (--runner MeshConsole64.exe) and runs it; there is no Windows build in this workflow. Run on an authorized Windows test host.
    test/macos_install_runtime.js | Darwin only: runs the real /usr/bin/plutil and installs under POSIX paths (it prints SKIP elsewhere). This workflow has no macOS runner.
    test/meshagent_provisioning_copy_runtime.js | Needs a built MeshAgent Windows binary (MeshService-Test.exe) and runs it; there is no Windows build in this workflow. Run on an authorized Windows test host.
    test/meshcentral_certificate_admission_runtime.js | Live probe: connects to a running MeshCentral server named by --msh. No server runs here.
    test/meshcentral_default3_mobile_connect_runtime.js | Needs the playwright package and a Chromium browser, which this workflow does not install.
    test/meshcentral_desktop_startup_input_runtime.js | Needs the playwright package and a Chromium browser, which this workflow does not install.
    test/meshcentral_inventory_runtime.js | Needs a built MeshAgent Windows binary (meshconsole/Release/MeshConsole64.exe) and runs it; there is no Windows build in this workflow. Run on an authorized Windows test host.
    test/meshcentral_trackpad_adapter_runtime.js | Needs the playwright package and a Chromium browser, which this workflow does not install.
    test/meshcentral_trackpad_loader_runtime.js | Needs the playwright package and a Chromium browser, which this workflow does not install. It also reads the served custom.js.
    test/meshcentral_viewer_touch_harness_runtime.js | Needs the playwright package and a Chromium browser, which this workflow does not install.
    test/partial_state_lifecycle_runtime.js | Runs -fullinstall/-fulluninstall of a built MeshService-2022.exe: changes the local Windows service on an approved test host.
    test/ppl_diagnostic_runtime.js | Windows only: reads process protection state through PowerShell.
    test/regression_cleanup_reporting_runtime.js | Builds and runs a .NET 10 fixture with dotnet run, which this workflow does not install.
    test/scriptcontainer_lifecycle_runtime.js | Needs a built MeshAgent Windows binary (an explicit MeshConsole64.exe) and runs it; there is no Windows build in this workflow. Run on an authorized Windows test host.
    test/scriptcontainer_startup_runtime.js | Needs a built MeshAgent Windows binary (an explicit MeshConsole64.exe) and runs it; there is no Windows build in this workflow. Run on an authorized Windows test host.
    test/stress_churn_runtime.js | Runs -fullinstall/-fulluninstall of a built MeshService-2022.exe repeatedly: changes the local Windows service on an approved test host.
    test/windows_inventory_runtime.js | Needs a built MeshAgent Windows binary (meshconsole/Release/MeshConsole64.exe) and runs it; there is no Windows build in this workflow. Run on an authorized Windows test host.
    test/windows_terminal_failure_runtime.js | Needs a built MeshAgent Windows binary (meshconsole/Release/MeshConsole64.exe) and runs it; there is no Windows build in this workflow. Run on an authorized Windows test host.

jobs:
  contracts:
    name: Contracts and MeshCentral tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LOG_ROOT: ${{ github.workspace }}/test-logs
    defaults:
      run:
        shell: bash
        working-directory: MeshAgent
    steps:
      - name: Check out MeshAgent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: MeshAgent
          persist-credentials: false

      - name: Check out MeshCentral beside MeshAgent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.MESHCENTRAL_REPOSITORY }}
          ref: ${{ env.MESHCENTRAL_REF }}
          path: MeshCentral
          # Full history: the upstream-base contract diffs fork bases such as 587973e8c.
          fetch-depth: 0
          persist-credentials: false

      - name: Set MESHCENTRAL_ROOT
        run: |
          root="$GITHUB_WORKSPACE/MeshCentral"
          test -d "$root/.git" || { echo "::error::MeshCentral checkout missing at $root"; exit 1; }
          echo "MESHCENTRAL_ROOT=$root" >> "$GITHUB_ENV"
          echo "MeshCentral $MESHCENTRAL_REPOSITORY@$MESHCENTRAL_REF is $(git -C "$root" rev-parse HEAD)"

      - name: Fetch pinned upstream MeshCentral tags
        working-directory: MeshCentral
        run: |
          set -euo pipefail
          refspecs=()
          for pin in $MESHCENTRAL_UPSTREAM_TAGS; do
            refspecs+=("refs/tags/${pin%%=*}:refs/tags/${pin%%=*}")
          done
          # Not forced: a fork tag with the same name and different target fails here.
          git fetch --no-tags "$MESHCENTRAL_UPSTREAM_URL" "${refspecs[@]}"
          for pin in $MESHCENTRAL_UPSTREAM_TAGS; do
            tag="${pin%%=*}"; want="${pin#*=}"
            got="$(git rev-parse --verify "refs/tags/$tag^{commit}")"
            if [ "$got" != "$want" ]; then
              echo "::error::Upstream tag $tag is $got, expected $want"
              exit 1
            fi
            echo "tag $tag = $got"
          done

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Fetch the pinned upstream MeshCentral package
        # Tests that compare the fork with stock upstream read this verified copy (since Stage 1
        # the installed package is the fork). The tool checks the tarball sha512 and the
        # extracted tree digest pinned in test/lib/meshcentral_upstream_reference.json; the
        # tests themselves never download it.
        # The second pin is the package production runs until the Stage 4 cutover (duplicate layout A).
        run: |
          set -euo pipefail
          python test/lib/fetch_upstream_reference.py
          python test/lib/fetch_upstream_reference.py --pin test/lib/meshcentral_production_reference.json

      - name: Check the agent-build store credential
        # The MeshCentral package carries the Windows agent builds pinned in
        # agents/agent-defaults.json. They are provisioned, so they live only as release assets
        # of the private hook repository, read with the release GitHub App. Runs without
        # repository secrets (pull requests from forks, Dependabot) cannot pack and stop here.
        env:
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
          RELEASE_APP_KEY_SET: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "$RELEASE_APP_ID" ]; then
            echo "::error::Repository variable RELEASE_APP_ID is not available to this run; it is needed to read the pinned agent builds from $AGENT_BUILDS_STORE"
            missing=1
          fi
          if [ "$RELEASE_APP_KEY_SET" != true ]; then
            echo "::error::Repository secret RELEASE_APP_PRIVATE_KEY is not available to this run (runs from forks and Dependabot get no secrets); it is needed to read the pinned agent builds from $AGENT_BUILDS_STORE"
            missing=1
          fi
          exit "$missing"

      - name: Mint a read-only token for the agent-build store
        id: agent_builds_app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: hook
          permission-contents: read

      - name: Fetch and verify the pinned agent builds
        # The release is named from the pins (build commit and pinned bytes). The tool writes a
        # file only after its size and SHA384 match; then the server's own verifier checks the
        # folder against agents/agent-defaults.json, as the server does at start.
        env:
          AGENT_BUILDS_TOKEN: ${{ steps.agent_builds_app.outputs.token }}
        run: |
          set -euo pipefail
          pins="$MESHCENTRAL_ROOT/agents/agent-defaults.json"
          [ -f "$pins" ] || { echo "::error::$pins missing: MeshCentral $MESHCENTRAL_REF has no fork agent pins (Stage 6)"; exit 1; }
          builds="$RUNNER_TEMP/agent-builds"
          python tools/deployment/agent_build_release.py fetch --store "$AGENT_BUILDS_STORE" --pins "$pins" --output "$builds"
          node "$MESHCENTRAL_ROOT/agents/check-releases.js" --directory "$builds"
          echo "AGENT_BUILDS_DIR=$builds" >> "$GITHUB_ENV"

      - name: Install MeshCentral wrapper dependencies
        id: wrapper
        run: |
          set -euo pipefail
          # The deployment wrapper is deploy/package.json, named meshcentral-deploy (Stage 1, SSOT D1).
          wrapper="$MESHCENTRAL_ROOT/deploy"
          manifest="$wrapper/package.json"
          [ -f "$manifest" ] || { echo "::error::$manifest missing: MeshCentral $MESHCENTRAL_REF does not have the Stage 1 layout"; exit 1; }
          name="$(node -p 'require(process.argv[1]).name' "$manifest")"
          [ "$name" = meshcentral-deploy ] || { echo "::error::$manifest is named $name, not meshcentral-deploy"; exit 1; }
          test -f "$wrapper/package-lock.json" || { echo "::error::$wrapper/package-lock.json missing; npm ci needs it"; exit 1; }
          echo "MeshCentral wrapper: $wrapper"
          echo "MESHCENTRAL_WRAPPER_PATH=$wrapper" >> "$GITHUB_ENV"
          # Stage 1: the wrapper installs the fork package from a tarball packed from the
          # checkout (file:dist/...). Pack it first, with the verified pinned agent builds
          # staged by --agents; npm ci then checks it against the integrity pinned in the
          # lockfile, so a pack that differs fails the job.
          spec="$(node -p 'require(process.argv[1]).dependencies.meshcentral || ""' "$wrapper/package.json")"
          case "$spec" in
            file:*)
              test -f "$wrapper/scripts/pack.js" || { echo "::error::meshcentral is $spec but $wrapper/scripts/pack.js is missing"; exit 1; }
              [ -n "${AGENT_BUILDS_DIR:-}" ] || { echo "::error::AGENT_BUILDS_DIR is not set: the pinned agent builds were not fetched"; exit 1; }
              node "$wrapper/scripts/pack.js" --agents "$AGENT_BUILDS_DIR"
              test -f "$wrapper/${spec#file:}" || { echo "::error::pack did not produce $wrapper/${spec#file:}"; exit 1; }
              ;;
          esac
          cd "$wrapper"
          npm ci --no-audit --no-fund
          node -p "'installed meshcentral ' + require('./node_modules/meshcentral/package.json').version"

      - name: Prepare test runner
        run: |
          set -euo pipefail
          mkdir -p "$LOG_ROOT"
          {
            echo "MeshAgent $(git rev-parse HEAD)"
            echo "MeshCentral $(git -C "$MESHCENTRAL_ROOT" rev-parse HEAD) ($MESHCENTRAL_REPOSITORY@$MESHCENTRAL_REF)"
            echo "Wrapper $MESHCENTRAL_WRAPPER_PATH"
            echo "node $(node --version), $(python --version 2>&1)"
          } > "$LOG_ROOT/environment.txt"
          cat > "$RUNNER_TEMP/test-runner.sh" <<'RUNNER'
          # Sourced by each test step. Runs one test per call, keeps its full output in
          # $LOG_ROOT/<group>/<name>.log and counts failures for finish_group.
          # Actions runs bash steps with -e; a failing test must be counted, not end the step.
          set +e -uo pipefail
          FAILED=0
          RAN=0
          declare -A EXCLUDED_REASON=()
          while IFS= read -r line; do
            [ -n "${line//[[:space:]]/}" ] || continue
            path="$(printf '%s' "${line%%|*}" | xargs)"
            reason="$(printf '%s' "${line#*|}" | sed 's/^ *//')"
            if [ "$path" = "$line" ] || [ -z "$reason" ]; then
              echo "::error::EXCLUDED_TESTS line needs '<path> | <reason>': $line"; exit 1
            fi
            [ -e "$path" ] || { echo "::error::EXCLUDED_TESTS names a missing test: $path"; exit 1; }
            EXCLUDED_REASON["$path"]="$reason"
          done <<< "$EXCLUDED_TESTS"

          # run_test <group> <test path or name> <working directory> <command...>
          run_test() {
            local group="$1" name="$2" dir="$3"; shift 3
            local log status start=$SECONDS
            log="$LOG_ROOT/$group/$(basename "$name").log"
            mkdir -p "$LOG_ROOT/$group"
            if [ -n "${EXCLUDED_REASON[$name]+set}" ]; then
              printf 'EXCLUDED\t%s\t%s\t%s\n' "$group" "$name" "${EXCLUDED_REASON[$name]}" | tee -a "$LOG_ROOT/results.tsv"
              return 0
            fi
            (cd "$dir" && timeout --kill-after=30 "$TEST_TIMEOUT_SECONDS" "$@") > "$log" 2>&1
            status=$?
            RAN=$((RAN + 1))
            if [ "$status" -eq 0 ]; then
              printf 'PASS\t%s\t%s\t%ss\n' "$group" "$name" "$((SECONDS - start))" | tee -a "$LOG_ROOT/results.tsv"
            else
              FAILED=$((FAILED + 1))
              printf 'FAIL(%s)\t%s\t%s\t%ss\n' "$status" "$group" "$name" "$((SECONDS - start))" | tee -a "$LOG_ROOT/results.tsv"
              echo "::group::$name output (exit $status)"; tail -n 100 "$log"; echo "::endgroup::"
              echo "::error title=$group::$name failed with exit $status"
            fi
          }

          # Every pattern must match at least one file: an empty match is a failure, not a skip.
          expand() {
            local found
            found="$(compgen -G "$1")" || { echo "::error::No tests match $1" >&2; return 1; }
            printf '%s\n' "$found" | LC_ALL=C sort
          }

          finish_group() {
            echo "$1: $RAN run, $FAILED failed"
            [ "$RAN" -gt 0 ] || { echo "::error::$1 ran no tests"; exit 1; }
            [ "$FAILED" -eq 0 ] || exit 1
          }
          RUNNER

      - name: JavaScript contracts (test/*_contract.js)
        if: ${{ !cancelled() && steps.wrapper.outcome == 'success' }}
        run: |
          source "$RUNNER_TEMP/test-runner.sh"
          tests="$(expand 'test/*_contract.js')" || exit 1
          while IFS= read -r t; do run_test js-contracts "$t" . node "$t"; done <<< "$tests"
          finish_group js-contracts

      - name: Node runtimes (test/*_runtime.js)
        # Behavioural probes that execute the agent modules and the MeshCentral fork in a vm with
        # injected processes, files and timers. Probes that need built binaries, a Windows desktop,
        # macOS, a browser or a live server are listed in EXCLUDED_TESTS with the reason.
        if: ${{ !cancelled() && steps.wrapper.outcome == 'success' }}
        run: |
          source "$RUNNER_TEMP/test-runner.sh"
          tests="$(expand 'test/*_runtime.js')" || exit 1
          while IFS= read -r t; do run_test node-runtimes "$t" . node "$t"; done <<< "$tests"
          finish_group node-runtimes

      - name: Python contracts (test/*_contract.py)
        if: ${{ !cancelled() && steps.wrapper.outcome == 'success' }}
        run: |
          source "$RUNNER_TEMP/test-runner.sh"
          tests="$(expand 'test/*_contract.py')" || exit 1
          while IFS= read -r t; do run_test py-contracts "$t" . python "$t"; done <<< "$tests"
          finish_group py-contracts

      - name: Release tooling tests (test/ci_release*_test.py)
        if: ${{ !cancelled() && steps.wrapper.outcome == 'success' }}
        run: |
          source "$RUNNER_TEMP/test-runner.sh"
          tests="$(expand 'test/ci_release*_test.py')" || exit 1
          while IFS= read -r t; do run_test ci-release "$t" . python "$t" -v; done <<< "$tests"
          finish_group ci-release

      - name: Deploy suites
        if: ${{ !cancelled() && steps.wrapper.outcome == 'success' }}
        run: |
          source "$RUNNER_TEMP/test-runner.sh"
          for t in \
            test/deploy_rollback_runtime.py \
            test/deploy_config_edit_runtime.py \
            test/deploy_meshctrl_runtime.py \
            test/deploy_artifact_selection_runtime.py \
            test/deploy_transport_health_runtime.py \
            test/deploy_proxy_certificate_sni_runtime.py \
            test/deploy_update_online_runtime.py
          do
            test -f "$t" || { echo "::error::Deploy suite $t is missing"; FAILED=$((FAILED + 1)); continue; }
            run_test deploy "$t" . python "$t"
          done
          finish_group deploy

      - name: MeshCentral tests (node --test deploy/tests/*.test.js)
        if: ${{ !cancelled() && steps.wrapper.outcome == 'success' }}
        run: |
          source "$RUNNER_TEMP/test-runner.sh"
          tests="$(cd "$MESHCENTRAL_ROOT" && expand 'deploy/tests/*.test.js')" || exit 1
          while IFS= read -r t; do run_test meshcentral "$t" "$MESHCENTRAL_ROOT" node --test "$t"; done <<< "$tests"
          finish_group meshcentral

      - name: Summarise results
        if: ${{ always() }}
        run: |
          results="$LOG_ROOT/results.tsv"
          [ -f "$results" ] || { echo "No results recorded."; exit 0; }
          {
            echo "### Contracts and MeshCentral tests"
            echo
            echo "| Result | Group | Test | Detail |"
            echo "|---|---|---|---|"
            # Failures first, then exclusions, then passes; run order within each.
            awk -F'\t' '{ rank = ($1 ~ /^FAIL/) ? 0 : ($1 == "EXCLUDED") ? 1 : 2; print rank "\t" $0 }' "$results" \
              | sort -s -t$'\t' -k1,1n | cut -f2- \
              | awk -F'\t' '{ printf "| %s | %s | `%s` | %s |\n", $1, $2, $3, $4 }'
          } >> "$GITHUB_STEP_SUMMARY"
          cut -f1 "$results" | sed 's/(.*//' | sort | uniq -c

      - name: Upload test logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contract-test-logs
          path: test-logs/
          if-no-files-found: warn
          retention-days: 30
