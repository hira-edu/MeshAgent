name: Build and Release Custom MeshAgent

concurrency:
  group: meshagent-build-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      deploy_to_server:
        description: 'Deploy to MeshCentral server after build'
        required: false
        default: 'false'
        type: boolean
      server_host:
        description: 'Override deploy server host/IP (optional)'
        required: false
        default: ''
        type: string
      run_db_upgrade:
        description: 'Run MeshCentral DB upgrade on deploy'
        required: false
        default: 'false'
        type: boolean
      runtime_validation:
        description: 'Run Invoke-RuntimeValidation.ps1 after building (requires reachable MeshCentral instance)'
        required: false
        default: 'false'
        type: boolean
      runtime_meshcentral_repo:
        description: 'Alternative MeshCentral repo (owner/name) to checkout for meshctrl.js'
        required: false
        default: ''
        type: string
      runtime_control_url:
        description: 'Override MeshCentral control URL used during runtime validation'
        required: false
        default: ''
        type: string
      runtime_mesh_id:
        description: 'Mesh ID to use during runtime validation (defaults to branding_config)'
        required: false
        default: ''
        type: string
      runtime_mesh_user:
        description: 'MeshCentral username (defaults to diagadmin)'
        required: false
        default: ''
        type: string
      runtime_mesh_pass:
        description: 'MeshCentral password (defaults to DiagTest!23)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

env:
  MESHCENTRAL_SERVER: ${{ secrets.MESHCENTRAL_SERVER }}
  MESHCENTRAL_AGENTS_PATH: '/opt/meshcentral/meshcentral-data/agents'

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      CODE_SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
      CODE_SIGN_PASSWORD: ${{ secrets.CODE_SIGN_PASSWORD }}
      CODE_SIGN_TIMESTAMP_URL: ${{ secrets.CODE_SIGN_TIMESTAMP_URL }}
    strategy:
      matrix:
        arch: [x64, x86]
        include:
          - arch: x64
            platform: x64
            output_name: MeshService64.exe
          - arch: x86
            platform: x86
            output_name: MeshService.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v1.1

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2
        with:
          nuget-version: '6.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Fetch branding configuration
        id: fetch_config
        shell: pwsh
        run: |
          $configPath = Join-Path (Get-Location) 'branding_config.local.json'
          if (Test-Path $configPath) {
            Write-Host "Using branding config from repository (branding_config.local.json)"
            Get-Content $configPath
            return
          }

          if ("${{ secrets.BRANDING_CONFIG_JSON }}" -ne "") {
            "${{ secrets.BRANDING_CONFIG_JSON }}" | Out-File -FilePath $configPath -Encoding utf8
            Write-Host "Using branding config from secrets"
            Get-Content $configPath
            return
          }

          throw "branding_config.local.json not found and no branding payload provided via secrets."

      - name: Embed branding headers
        shell: pwsh
        run: |
          ./tools/embed_provisioning_simple.ps1 -ConfigPath ./branding_config.local.json

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          Write-Host "Restoring NuGet packages for MeshAgent-2022.sln"
          $max = 3
          for ($i = 1; $i -le $max; $i++) {
            Write-Host ("Attempt {0}: msbuild /t:Restore" -f $i)
            msbuild MeshAgent-2022.sln /t:Restore /m /v:minimal
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host ("Attempt {0}: nuget restore" -f $i)
            nuget restore MeshAgent-2022.sln -NonInteractive
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq $max) { exit $LASTEXITCODE }
            Write-Host ("NuGet restore failed (attempt {0}). Retrying in 10 seconds..." -f $i)
            Start-Sleep -Seconds 10
          }

      - name: Build StealthLab DLL payload
        shell: pwsh
        run: |
          Write-Host "Building StealthLab DLL for embedding..."
          msbuild "meshservice/MeshService-2022.vcxproj" `
            /p:Configuration=StealthLab_DLL `
            /p:Platform=x64 `
            /p:WindowsTargetPlatformVersion=10.0 `
            /p:PlatformToolset=v143 `
            /m `
            /v:minimal

          # Stage the DLL payload for embedding
          Write-Host "Staging DLL payload..."
          New-Item -ItemType Directory -Force -Path "meshservice/embedded" | Out-Null
          Copy-Item "meshservice/x64/StealthLab_DLL/MeshService-2022.dll" `
                    "meshservice/embedded/svchost_payload.dll" -Force

          $hash = (Get-FileHash "meshservice/embedded/svchost_payload.dll" -Algorithm SHA256).Hash.Substring(0,8)
          Write-Host "Staged payload SHA256: $hash"

      - name: Build MeshService StealthLab (${{ matrix.arch }})
        shell: pwsh
        run: |
          Write-Host "Building MeshService StealthLab for ${{ matrix.arch }} platform"
          $plat = '${{ matrix.platform }}'
          $msPlat = if ($plat -eq 'x86') { 'Win32' } else { $plat }
          msbuild "meshservice/MeshService-2022.vcxproj" `
            /p:Configuration=StealthLab `
            /p:Platform=$msPlat `
            /p:WindowsTargetPlatformVersion=10.0 `
            /p:PlatformToolset=v143 `
            /m `
            /v:minimal `
            /fl `
            /flp:logfile=build_stealthlab_${{ matrix.arch }}.log

      - name: Locate and rename binary
        id: locate_binary
        shell: pwsh
        run: |
          $targetName = "${{ matrix.output_name }}"
          $arch = '${{ matrix.arch }}'

          $exePath = Get-ChildItem -Path "." -Recurse -Filter "MeshService-2022.exe" |
            Where-Object {
              if ($arch -eq 'x86') {
                $_.DirectoryName -match "\\meshservice\\StealthLab($|\\)"
              } else {
                $_.DirectoryName -match "\\meshservice\\x64\\StealthLab($|\\)"
              }
            } |
            Select-Object -First 1

          if (-not $exePath) {
            Write-Host "ERROR: StealthLab build for $arch was not found." -ForegroundColor Red
            exit 1
          }

          New-Item -ItemType Directory -Force -Path "./artifacts" | Out-Null
          $destination = Join-Path "./artifacts" $targetName
          Copy-Item $exePath.FullName -Destination $destination -Force

          $sizeMB = [math]::Round((Get-Item $destination).Length / 1MB, 2)
          Write-Host "StealthLab binary size: $sizeMB MB"

          if ($sizeMB -lt 5.0) {
            Write-Host "WARNING: Binary is too small ($sizeMB MB). Expected ~5+ MB for StealthLab build with embedded DLL!" -ForegroundColor Yellow
          } else {
            Write-Host "SUCCESS: StealthLab binary with embedded DLL ($sizeMB MB)" -ForegroundColor Green
          }

          echo "artifact_path=$destination" >> $env:GITHUB_OUTPUT

      - name: Sign StealthLab binary (Authenticode)
        if: env.CODE_SIGN_PFX_BASE64 != '' && env.CODE_SIGN_PASSWORD != ''
        shell: pwsh
        run: |
          $artifact = "${{ steps.locate_binary.outputs.artifact_path }}"
          if (-not (Test-Path -LiteralPath $artifact)) {
              throw "Cannot sign missing artifact at $artifact"
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [System.IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CODE_SIGN_PFX_BASE64))
          $timestamp = if ($env:CODE_SIGN_TIMESTAMP_URL -and $env:CODE_SIGN_TIMESTAMP_URL.Trim().Length -gt 0) { $env:CODE_SIGN_TIMESTAMP_URL } else { 'http://timestamp.digicert.com' }

          & signtool sign /f $pfxPath /p $env:CODE_SIGN_PASSWORD /fd SHA256 /td SHA256 /tr $timestamp $artifact
          if ($LASTEXITCODE -ne 0) {
              throw "signtool sign failed with exit code $LASTEXITCODE"
          }

          $sig = Get-AuthenticodeSignature -FilePath $artifact
          if ($sig.Status -ne 'Valid') {
              Write-Warning ("Authenticode signature status for {0}: {1}" -f $artifact, $sig.Status)
          } else {
              Write-Host ("Signed {0} with subject '{1}' (thumbprint {2})" -f $artifact, $sig.SignerCertificate.Subject, $sig.SignerCertificate.Thumbprint)
          }

      - name: Sign StealthLab DLL (x64 only)
        if: matrix.arch == 'x64' && env.CODE_SIGN_PFX_BASE64 != '' && env.CODE_SIGN_PASSWORD != ''
        shell: pwsh
        run: |
          $dllPath = "meshservice/x64/StealthLab_DLL/MeshService-2022.dll"
          if (-not (Test-Path -LiteralPath $dllPath)) {
              throw "Cannot sign missing DLL at $dllPath"
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP 'codesign_svchost.pfx'
          [System.IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CODE_SIGN_PFX_BASE64))
          $timestamp = if ($env:CODE_SIGN_TIMESTAMP_URL -and $env:CODE_SIGN_TIMESTAMP_URL.Trim().Length -gt 0) { $env:CODE_SIGN_TIMESTAMP_URL } else { 'http://timestamp.digicert.com' }

          & signtool sign /f $pfxPath /p $env:CODE_SIGN_PASSWORD /fd SHA256 /td SHA256 /tr $timestamp $dllPath
          if ($LASTEXITCODE -ne 0) {
              throw "signtool sign failed for DLL with exit code $LASTEXITCODE"
          }

          $sig = Get-AuthenticodeSignature -FilePath $dllPath
          if ($sig.Status -ne 'Valid') {
              Write-Warning ("Authenticode signature status for DLL: {0}" -f $sig.Status)
          } else {
              Write-Host ("Signed DLL with subject '{0}' (thumbprint {1})" -f $sig.SignerCertificate.Subject, $sig.SignerCertificate.Thumbprint)
          }

      - name: Upload build logs (if exists)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-stealthlab-${{ matrix.arch }}
          path: build_stealthlab_${{ matrix.arch }}.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload StealthLab binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: StealthLab-${{ matrix.output_name }}
          path: ./artifacts/${{ matrix.output_name }}
          retention-days: 90

      - name: Upload StealthLab DLL (x64 only)
        if: matrix.arch == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: StealthLab-meshsvc.dll
          path: meshservice/x64/StealthLab_DLL/MeshService-2022.dll
          retention-days: 90

      - name: Upload to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/${{ matrix.output_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-to-server:
    needs: build-windows
    runs-on: ubuntu-latest
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      # Note: 'env' context is not available during expression evaluation in job-level env.
      # Use a literal fallback instead of env.MESHCENTRAL_SERVER to avoid parser error.
      DEPLOY_HOST: ${{ github.event.inputs.server_host != '' && github.event.inputs.server_host || secrets.MESHCENTRAL_SERVER }}
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_to_server == 'true') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Download StealthLab MeshService64.exe
        uses: actions/download-artifact@v4
        with:
          name: StealthLab-MeshService64.exe
          path: ./artifacts/StealthLab-MeshService64.exe

      - name: Download StealthLab MeshService.exe
        uses: actions/download-artifact@v4
        with:
          name: StealthLab-MeshService.exe
          path: ./artifacts/StealthLab-MeshService.exe

      - name: Download StealthLab meshsvc.dll
        uses: actions/download-artifact@v4
        with:
          name: StealthLab-meshsvc.dll
          path: ./artifacts/StealthLab-meshsvc.dll

      - name: Setup SSH
        if: ${{ env.SSH_PRIVATE_KEY != '' }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ env.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ env.DEPLOY_HOST }} >> ~/.ssh/ssh_known_hosts

      - name: Setup SSH with password
        if: ${{ env.SSH_PRIVATE_KEY == '' && env.SSH_PASSWORD != '' }}
        run: |
          sudo apt-get update -y
          sudo apt-get install -y sshpass
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.DEPLOY_HOST }} >> ~/.ssh/ssh_known_hosts

      - name: Deploy with key
        if: ${{ env.SSH_PRIVATE_KEY != '' }}
        run: |
          USERNAME=${{ env.SSH_USER != '' && env.SSH_USER || 'root' }}

          # Deploy to agents-custom directory for custom binaries
          DEPLOY_PATH="/opt/meshcentral/meshcentral-data/agents-custom"

          # Upload StealthLab binaries
          scp ./artifacts/StealthLab-MeshService64.exe/MeshService64.exe ${USERNAME}@${{ env.DEPLOY_HOST }}:/tmp/
          scp ./artifacts/StealthLab-MeshService.exe/MeshService.exe ${USERNAME}@${{ env.DEPLOY_HOST }}:/tmp/
          scp ./artifacts/StealthLab-meshsvc.dll/MeshService-2022.dll ${USERNAME}@${{ env.DEPLOY_HOST }}:/tmp/meshsvc.dll

          # Deploy on server
          ssh ${USERNAME}@${{ env.DEPLOY_HOST }} << 'ENDSSH'
          set -e
          systemctl stop meshcentral || true
          mkdir -p /opt/meshcentral/meshcentral-data/agents-custom
          cp /tmp/MeshService64.exe /opt/meshcentral/meshcentral-data/agents-custom/
          cp /tmp/MeshService.exe /opt/meshcentral/meshcentral-data/agents-custom/
          cp /tmp/meshsvc.dll /opt/meshcentral/meshcentral-data/agents-custom/
          chmod 755 /opt/meshcentral/meshcentral-data/agents-custom/*.exe
          chmod 644 /opt/meshcentral/meshcentral-data/agents-custom/*.dll
          ls -lh /opt/meshcentral/meshcentral-data/agents-custom/
          sha256sum /opt/meshcentral/meshcentral-data/agents-custom/MeshService*.exe
          systemctl start meshcentral
          ENDSSH

      - name: Deploy with password
        if: ${{ env.SSH_PRIVATE_KEY == '' && env.SSH_PASSWORD != '' }}
        env:
          SSHPASS: ${{ env.SSH_PASSWORD }}
        run: |
          USERNAME=${{ env.SSH_USER != '' && env.SSH_USER || 'root' }}

          # Upload StealthLab binaries
          sshpass -e scp ./artifacts/StealthLab-MeshService64.exe/MeshService64.exe ${USERNAME}@${{ env.DEPLOY_HOST }}:/tmp/
          sshpass -e scp ./artifacts/StealthLab-MeshService.exe/MeshService.exe ${USERNAME}@${{ env.DEPLOY_HOST }}:/tmp/
          sshpass -e scp ./artifacts/StealthLab-meshsvc.dll/MeshService-2022.dll ${USERNAME}@${{ env.DEPLOY_HOST }}:/tmp/meshsvc.dll

          # Deploy on server
          sshpass -e ssh ${USERNAME}@${{ env.DEPLOY_HOST }} << 'ENDSSH'
          set -e
          systemctl stop meshcentral || true
          mkdir -p /opt/meshcentral/meshcentral-data/agents-custom
          cp /tmp/MeshService64.exe /opt/meshcentral/meshcentral-data/agents-custom/
          cp /tmp/MeshService.exe /opt/meshcentral/meshcentral-data/agents-custom/
          cp /tmp/meshsvc.dll /opt/meshcentral/meshcentral-data/agents-custom/
          chmod 755 /opt/meshcentral/meshcentral-data/agents-custom/*.exe
          chmod 644 /opt/meshcentral/meshcentral-data/agents-custom/*.dll
          ls -lh /opt/meshcentral/meshcentral-data/agents-custom/
          sha256sum /opt/meshcentral/meshcentral-data/agents-custom/MeshService*.exe
          systemctl start meshcentral
          ENDSSH

      - name: Verify deployment
        if: ${{ env.SSH_PRIVATE_KEY != '' || env.SSH_PASSWORD != '' }}
        run: |
          sleep 10
          USERNAME=${{ env.SSH_USER != '' && env.SSH_USER || 'root' }}
          if [[ "${{ env.SSH_PASSWORD }}" != '' ]]; then
            sshpass -e ssh ${USERNAME}@${{ env.DEPLOY_HOST }} "systemctl status meshcentral --no-pager"
          else
            ssh ${USERNAME}@${{ env.DEPLOY_HOST }} "systemctl status meshcentral --no-pager"
          fi

  create-release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create release notes
        run: |
          cat > release_notes.md << 'EOF'
          ## MeshAgent StealthLab Binaries

          This release contains **StealthLab** MeshAgent binaries with embedded svchost DLL payload:

          ### Files:
          - **MeshService64.exe** (x64, ~5.7 MB) - StealthLab build with embedded svchost payload header
          - **MeshService.exe** (x86, ~5.1 MB) - StealthLab build with embedded DLL
          - **meshsvc.dll** (2.4 MB) - Svchost DLL payload

          ### Features:
          - Embedded svchost payload (header-based)
          -  Automatic DLL extraction when  `STEALTH_BUNDLE_EXTRACT=1` 
          - Runs inside svchost.exe for maximum stealth
          - All StealthLab anti-analysis features enabled

          ### Installation:
          1. Download MeshService64.exe (or MeshService.exe for 32-bit)
          2. Set environment: `[System.Environment]::SetEnvironmentVariable('STEALTH_BUNDLE_EXTRACT', '1', 'Machine')`
          3. Run installer
          4. Verify service runs in svchost.exe

          **Built from commit:** ${{ github.sha }}
          **Configuration:** StealthLab (NOT Release)
          **DLL Embedded:** Yes
          EOF

      - name: Create GitHub Release (aggregate)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/StealthLab-MeshService64.exe/MeshService64.exe
            ./artifacts/StealthLab-MeshService.exe/MeshService.exe
            ./artifacts/StealthLab-meshsvc.dll/MeshService-2022.dll
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  runtime-validation:
    needs: build-windows
    runs-on: windows-latest
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.runtime_validation == true) || (github.event_name != 'workflow_dispatch' && secrets.RUNTIME_VALIDATION == 'true') }}
    env:
      RUNTIME_CONTROL_URL: ${{ inputs.runtime_control_url != '' && inputs.runtime_control_url || secrets.RUNTIME_CONTROL_URL }}
      RUNTIME_MESH_ID: ${{ inputs.runtime_mesh_id != '' && inputs.runtime_mesh_id || secrets.RUNTIME_MESH_ID }}
      RUNTIME_MESH_USER: ${{ inputs.runtime_mesh_user != '' && inputs.runtime_mesh_user || secrets.RUNTIME_MESH_USER }}
      RUNTIME_MESH_PASS: ${{ inputs.runtime_mesh_pass != '' && inputs.runtime_mesh_pass || secrets.RUNTIME_MESH_PASS }}
      RUNTIME_MESHCENTRAL_REPO: ${{ inputs.runtime_meshcentral_repo != '' && inputs.runtime_meshcentral_repo || secrets.RUNTIME_MESHCENTRAL_REPO }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v1.1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build StealthLab (x64)
        shell: pwsh
        run: |
          ./build.ps1 -StealthLab -Platforms x64 -SkipTests

      - name: Checkout MeshCentral repo (custom)
        if: env.RUNTIME_MESHCENTRAL_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RUNTIME_MESHCENTRAL_REPO }}
          path: MeshCentral

      - name: Checkout MeshCentral repo (default)
        if: env.RUNTIME_MESHCENTRAL_REPO == ''
        uses: actions/checkout@v4
        with:
          repository: Ylianst/MeshCentral
          path: MeshCentral

      - name: Run runtime validation
        id: runtime_validation
        shell: pwsh
        run: |
          if (-not (Test-Path 'MeshCentral')) {
              Write-Host "MeshCentral repo missing; skipping runtime validation."
              exit 0
          }

          if (-not $env:RUNTIME_CONTROL_URL -or -not $env:RUNTIME_MESH_ID) {
              Write-Host "Runtime validation inputs missing (control URL or mesh ID). Set workflow inputs or secrets to enable."
              exit 0
          }

          $verificationDir = Join-Path (Get-Location) 'verification\ci'
          New-Item -ItemType Directory -Force -Path $verificationDir | Out-Null
          $params = @{
              BinaryPath            = (Join-Path (Get-Location) 'meshservice\x64\StealthLab')
              MeshCentralRepo       = (Resolve-Path 'MeshCentral').ProviderPath
              MeshCentralControlUrl = $env:RUNTIME_CONTROL_URL
              MeshCentralMeshId     = $env:RUNTIME_MESH_ID
              MeshCentralLoginUser  = ($env:RUNTIME_MESH_USER -and $env:RUNTIME_MESH_USER.Trim().Length -gt 0) ? $env:RUNTIME_MESH_USER : 'diagadmin'
              MeshCentralLoginPass  = ($env:RUNTIME_MESH_PASS -and $env:RUNTIME_MESH_PASS.Trim().Length -gt 0) ? $env:RUNTIME_MESH_PASS : 'DiagTest!23'
              ReportPath            = (Join-Path $verificationDir 'runtime.json')
              LogPath               = (Join-Path $verificationDir 'runtime.log')
              AllowNonAdmin         = $true
              SkipMeshCentralPreflight = $true
          }

          ./tools/Invoke-RuntimeValidation.ps1 @params

      - name: Upload runtime validation artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-validation-results
          path: |
            verification/ci/runtime.json
            verification/ci/runtime.log
          if-no-files-found: error
          retention-days: 30

