name: Build and Release Custom MeshAgent

concurrency:
  group: meshagent-build-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      deploy_to_server:
        description: 'Deploy to MeshCentral server after build'
        required: false
        default: 'false'
        type: boolean
      server_host:
        description: 'Override deploy server host/IP (optional)'
        required: false
        default: ''
        type: string
      run_db_upgrade:
        description: 'Run MeshCentral DB upgrade on deploy'
        required: false
        default: 'false'
        type: boolean
      runtime_validation:
        description: 'Run Invoke-RuntimeValidation.ps1 after building (requires reachable MeshCentral instance)'
        required: false
        default: 'false'
        type: boolean
      runtime_meshcentral_repo:
        description: 'Alternative MeshCentral repo (owner/name) to checkout for meshctrl.js'
        required: false
        default: ''
        type: string
      runtime_control_url:
        description: 'Override MeshCentral control URL used during runtime validation'
        required: false
        default: ''
        type: string
      runtime_mesh_id:
        description: 'Mesh ID to use during runtime validation (defaults to branding_config)'
        required: false
        default: ''
        type: string
      runtime_mesh_user:
        description: 'MeshCentral username (defaults to diagadmin)'
        required: false
        default: ''
        type: string
      runtime_mesh_pass:
        description: 'MeshCentral password (defaults to DiagTest!23)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

env:
  MESHCENTRAL_SERVER: 'high.support'
  MESHCENTRAL_AGENTS_PATH: '/opt/meshcentral/meshcentral-data/agents'

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      CODE_SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
      CODE_SIGN_PASSWORD: ${{ secrets.CODE_SIGN_PASSWORD }}
      CODE_SIGN_TIMESTAMP_URL: ${{ secrets.CODE_SIGN_TIMESTAMP_URL }}
    strategy:
      matrix:
        arch: [x64, x86, arm64]
        include:
          - arch: x64
            platform: x64
            output_name: MeshService64.exe
            msh_output_name: MeshService64.msh
            expected_machine: '0x8664'
            dll_artifact_name: MeshServiceRuntime-diagsvc.dll
          - arch: x86
            platform: x86
            output_name: MeshService.exe
            msh_output_name: MeshService.msh
            expected_machine: '0x014c'
          - arch: arm64
            platform: ARM64
            output_name: MeshServiceARM64.exe
            msh_output_name: MeshServiceARM64.msh
            expected_machine: '0xaa64'
            dll_artifact_name: MeshServiceRuntime-MeshServiceARM64.dll

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Checkout pinned runtime components
        uses: actions/checkout@v4
        with:
          repository: hira-edu/hook
          ref: 8b0e4deeb283634517cc5c957624a402a2ed3f82
          path: runtime-source

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2
        with:
          nuget-version: '6.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Fetch branding configuration
        id: fetch_config
        shell: pwsh
        env:
          BRANDING_CONFIG_JSON: ${{ secrets.BRANDING_CONFIG_JSON }}
        run: |
          $configPath = Join-Path (Get-Location) 'branding_config.local.json'
          if (Test-Path -LiteralPath $configPath) {
            Write-Host "Using existing local branding configuration"
            return
          }

          if (-not [string]::IsNullOrWhiteSpace($env:BRANDING_CONFIG_JSON)) {
            [System.IO.File]::WriteAllText(
              $configPath,
              $env:BRANDING_CONFIG_JSON,
              [System.Text.UTF8Encoding]::new($false)
            )
            Write-Host "Using branding config from secrets"
            return
          }

          $trackedConfigPath = Join-Path (Get-Location) 'branding_config.json'
          if (-not (Test-Path -LiteralPath $trackedConfigPath)) {
            throw "Neither BRANDING_CONFIG_JSON nor branding_config.json is available."
          }
          Copy-Item -LiteralPath $trackedConfigPath -Destination $configPath
          Write-Host "Using tracked branding_config.json for non-deployment validation"

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          Write-Host "Restoring NuGet packages for MeshAgent-2022.sln"
          $max = 3
          for ($i = 1; $i -le $max; $i++) {
            Write-Host ("Attempt {0}: msbuild /t:Restore" -f $i)
            msbuild MeshAgent-2022.sln /t:Restore /m /v:minimal
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host ("Attempt {0}: nuget restore" -f $i)
            nuget restore MeshAgent-2022.sln -NonInteractive
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq $max) { exit $LASTEXITCODE }
            Write-Host ("NuGet restore failed (attempt {0}). Retrying in 10 seconds..." -f $i)
            Start-Sleep -Seconds 10
          }

      - name: Generate source commit header
        shell: pwsh
        run: python tools/generate_commit_header.py

      - name: Build matching MeshServiceRuntime DLL payload
        id: bundle_payload
        shell: pwsh
        run: |
          $bundlePlatform = if ('${{ matrix.arch }}' -eq 'arm64') { 'ARM64' } else { 'x64' }
          $bundleDirectory = if ($bundlePlatform -eq 'ARM64') { 'ARM64' } else { 'x64' }
          Write-Host "Building $bundlePlatform MeshServiceRuntime DLL for embedding..."
          msbuild "meshservice/MeshService-2022.vcxproj" `
            /p:Configuration=MeshServiceBundle `
            /p:Platform=$bundlePlatform `
            /p:RuntimeComponentSourceRoot="$env:GITHUB_WORKSPACE\runtime-source" `
            /p:WindowsTargetPlatformVersion=10.0 `
            /p:PlatformToolset=v143 `
            /m `
            /v:minimal

          $dllPath = "meshservice/$bundleDirectory/MeshServiceBundle/MeshService-2022.dll"
          if (-not (Test-Path -LiteralPath $dllPath)) {
            throw "Matching service DLL was not produced at $dllPath"
          }
          $hash = (Get-FileHash $dllPath -Algorithm SHA256).Hash.Substring(0,8)
          Write-Host "Staged payload SHA256: $hash"
          "dll_path=$dllPath" >> $env:GITHUB_OUTPUT

      - name: Sign native 64-bit MeshServiceRuntime DLL before embedding
        if: matrix.arch != 'x86' && env.CODE_SIGN_PFX_BASE64 != '' && env.CODE_SIGN_PASSWORD != ''
        shell: pwsh
        run: |
          $dllPath = "${{ steps.bundle_payload.outputs.dll_path }}"
          if (-not (Test-Path -LiteralPath $dllPath)) {
              throw "Cannot sign missing DLL at $dllPath"
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP 'codesign_runtime_host.pfx'
          [System.IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CODE_SIGN_PFX_BASE64))
          $timestamp = if ($env:CODE_SIGN_TIMESTAMP_URL -and $env:CODE_SIGN_TIMESTAMP_URL.Trim().Length -gt 0) { $env:CODE_SIGN_TIMESTAMP_URL } else { 'http://timestamp.digicert.com' }

          & signtool sign /f $pfxPath /p $env:CODE_SIGN_PASSWORD /fd SHA256 /td SHA256 /tr $timestamp $dllPath
          if ($LASTEXITCODE -ne 0) {
              throw "signtool sign failed for DLL with exit code $LASTEXITCODE"
          }

          $sig = Get-AuthenticodeSignature -FilePath $dllPath
          if ($sig.Status -ne 'Valid') {
              Write-Warning ("Authenticode signature status for DLL: {0}" -f $sig.Status)
          } else {
              Write-Host ("Signed DLL with subject '{0}' (thumbprint {1})" -f $sig.SignerCertificate.Subject, $sig.SignerCertificate.Thumbprint)
          }

      - name: Build MeshService MeshServiceRuntime (${{ matrix.arch }})
        shell: pwsh
        run: |
          Write-Host "Building MeshService MeshServiceRuntime for ${{ matrix.arch }} platform"
          $plat = '${{ matrix.platform }}'
          $msPlat = if ($plat -eq 'x86') { 'Win32' } else { $plat }
          msbuild "meshservice/MeshService-2022.vcxproj" `
            /p:Configuration=MeshServiceRuntime `
            /p:Platform=$msPlat `
            /p:RuntimeComponentSourceRoot="$env:GITHUB_WORKSPACE\runtime-source" `
            /p:WindowsTargetPlatformVersion=10.0 `
            /p:PlatformToolset=v143 `
            /p:MeshAgentSkipMeshServiceBundleDependencyBuild=1 `
            /m `
            /v:minimal `
            /fl `
            /flp:logfile=build_servicelab_${{ matrix.arch }}.log

      - name: Locate and rename binary
        id: locate_binary
        shell: pwsh
        run: |
          $targetName = "${{ matrix.output_name }}"
          $arch = '${{ matrix.arch }}'

          $exePath = Get-ChildItem -Path "." -Recurse -Filter "MeshService-2022.exe" |
            Where-Object {
              if ($arch -eq 'x86') {
                $_.DirectoryName -match "\\meshservice\\MeshServiceRuntime($|\\)"
              } elseif ($arch -eq 'arm64') {
                $_.DirectoryName -match "\\meshservice\\ARM64\\MeshServiceRuntime($|\\)"
              } else {
                $_.DirectoryName -match "\\meshservice\\x64\\MeshServiceRuntime($|\\)"
              }
            } |
            Select-Object -First 1

          if (-not $exePath) {
            Write-Host "ERROR: MeshServiceRuntime build for $arch was not found." -ForegroundColor Red
            exit 1
          }

          New-Item -ItemType Directory -Force -Path "./artifacts" | Out-Null
          $destination = Join-Path "./artifacts" $targetName
          Copy-Item $exePath.FullName -Destination $destination -Force
          $sourceMsh = [System.IO.Path]::ChangeExtension($exePath.FullName, '.msh')
          $mshDestination = Join-Path "./artifacts" '${{ matrix.msh_output_name }}'
          if (-not (Test-Path -LiteralPath $sourceMsh)) {
            throw "Provisioning manifest missing at $sourceMsh"
          }
          Copy-Item -LiteralPath $sourceMsh -Destination $mshDestination -Force

          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path -LiteralPath $destination))
          if ($bytes.Length -lt 0x40 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw "Built artifact is not a PE image: $destination"
          }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          $expectedMachine = [Convert]::ToUInt16('${{ matrix.expected_machine }}'.Substring(2), 16)
          if ($machine -ne $expectedMachine) {
            throw ("Wrong PE machine for {0}: expected 0x{1:X4}, found 0x{2:X4}" -f $targetName, $expectedMachine, $machine)
          }

          $sizeMB = [math]::Round((Get-Item $destination).Length / 1MB, 2)
          Write-Host "MeshServiceRuntime binary size: $sizeMB MB"

          if ($sizeMB -lt 5.0) {
            Write-Host "WARNING: Binary is too small ($sizeMB MB). Expected ~5+ MB for MeshServiceRuntime build with embedded DLL!" -ForegroundColor Yellow
          } else {
            Write-Host "SUCCESS: MeshServiceRuntime binary with embedded DLL ($sizeMB MB)" -ForegroundColor Green
          }

          echo "artifact_path=$destination" >> $env:GITHUB_OUTPUT
          echo "msh_path=$mshDestination" >> $env:GITHUB_OUTPUT

      - name: Sign MeshServiceRuntime binary (Authenticode)
        if: env.CODE_SIGN_PFX_BASE64 != '' && env.CODE_SIGN_PASSWORD != ''
        shell: pwsh
        run: |
          $artifact = "${{ steps.locate_binary.outputs.artifact_path }}"
          if (-not (Test-Path -LiteralPath $artifact)) {
              throw "Cannot sign missing artifact at $artifact"
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [System.IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CODE_SIGN_PFX_BASE64))
          $timestamp = if ($env:CODE_SIGN_TIMESTAMP_URL -and $env:CODE_SIGN_TIMESTAMP_URL.Trim().Length -gt 0) { $env:CODE_SIGN_TIMESTAMP_URL } else { 'http://timestamp.digicert.com' }

          & signtool sign /f $pfxPath /p $env:CODE_SIGN_PASSWORD /fd SHA256 /td SHA256 /tr $timestamp $artifact
          if ($LASTEXITCODE -ne 0) {
              throw "signtool sign failed with exit code $LASTEXITCODE"
          }

          $sig = Get-AuthenticodeSignature -FilePath $artifact
          if ($sig.Status -ne 'Valid') {
              Write-Warning ("Authenticode signature status for {0}: {1}" -f $artifact, $sig.Status)
          } else {
              Write-Host ("Signed {0} with subject '{1}' (thumbprint {2})" -f $artifact, $sig.SignerCertificate.Subject, $sig.SignerCertificate.Thumbprint)
          }

      - name: Upload build logs (if exists)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-servicelab-${{ matrix.arch }}
          path: build_servicelab_${{ matrix.arch }}.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Validate embedded service DLL parity
        if: matrix.arch != 'x86'
        shell: pwsh
        run: |
          node ./test/service_bundle_embedding_contract.js --architecture '${{ matrix.arch }}'

      - name: Upload MeshServiceRuntime binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeshServiceRuntime-${{ matrix.output_name }}
          path: |
            ./artifacts/${{ matrix.output_name }}
            ./artifacts/${{ matrix.msh_output_name }}
          retention-days: 90

      - name: Stage ARM64 DLL with canonical release name
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          Copy-Item -LiteralPath "${{ steps.bundle_payload.outputs.dll_path }}" -Destination ./artifacts/MeshServiceARM64.dll -Force

      - name: Upload native 64-bit MeshServiceRuntime DLL
        if: matrix.arch != 'x86'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.dll_artifact_name }}
          path: ${{ matrix.arch == 'arm64' && './artifacts/MeshServiceARM64.dll' || steps.bundle_payload.outputs.dll_path }}
          retention-days: 90

      - name: Upload to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/${{ matrix.output_name }}
            ./artifacts/${{ matrix.msh_output_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-to-server:
    needs: build-windows
    runs-on: ubuntu-latest
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      # Note: 'env' context is not available during expression evaluation in job-level env.
      # Use a literal fallback instead of env.MESHCENTRAL_SERVER to avoid parser error.
      DEPLOY_HOST: ${{ github.event.inputs.server_host != '' && github.event.inputs.server_host || 'high.support' }}
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_to_server == 'true') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Download MeshServiceRuntime MeshService64.exe
        uses: actions/download-artifact@v4
        with:
          name: MeshServiceRuntime-MeshService64.exe
          path: ./artifacts/MeshServiceRuntime-MeshService64.exe

      - name: Download MeshServiceRuntime MeshService.exe
        uses: actions/download-artifact@v4
        with:
          name: MeshServiceRuntime-MeshService.exe
          path: ./artifacts/MeshServiceRuntime-MeshService.exe

      - name: Download MeshServiceRuntime MeshServiceARM64.exe
        uses: actions/download-artifact@v4
        with:
          name: MeshServiceRuntime-MeshServiceARM64.exe
          path: ./artifacts/MeshServiceRuntime-MeshServiceARM64.exe

      - name: Download MeshServiceRuntime diagsvc.dll
        uses: actions/download-artifact@v4
        with:
          name: MeshServiceRuntime-diagsvc.dll
          path: ./artifacts/MeshServiceRuntime-diagsvc.dll

      - name: Download MeshServiceRuntime MeshServiceARM64.dll
        uses: actions/download-artifact@v4
        with:
          name: MeshServiceRuntime-MeshServiceARM64.dll
          path: ./artifacts/MeshServiceRuntime-MeshServiceARM64.dll

      - name: Setup SSH
        if: ${{ env.SSH_PRIVATE_KEY != '' }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ env.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ env.DEPLOY_HOST }} >> ~/.ssh/ssh_known_hosts

      - name: Setup SSH with password
        if: ${{ env.SSH_PRIVATE_KEY == '' && env.SSH_PASSWORD != '' }}
        run: |
          sudo apt-get update -y
          sudo apt-get install -y sshpass
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.DEPLOY_HOST }} >> ~/.ssh/ssh_known_hosts

      - name: Deploy with key
        if: ${{ env.SSH_PRIVATE_KEY != '' }}
        run: |
          USERNAME=${{ env.SSH_USER != '' && env.SSH_USER || 'root' }}

          # Deploy to agents-custom directory for custom binaries
          DEPLOY_PATH="/opt/meshcentral/meshcentral-data/agents-custom"

          # Upload MeshServiceRuntime binaries
          scp ./artifacts/MeshServiceRuntime-MeshService64.exe/MeshService64.exe ${USERNAME}@${{ env.DEPLOY_HOST }}:/tmp/
          scp ./artifacts/MeshServiceRuntime-MeshService64.exe/MeshService64.msh ${USERNAME}@${{ env.DEPLOY_HOST }}:/tmp/
          scp ./artifacts/MeshServiceRuntime-MeshService.exe/MeshService.exe ${USERNAME}@${{ env.DEPLOY_HOST }}:/tmp/
          scp ./artifacts/MeshServiceRuntime-MeshService.exe/MeshService.msh ${USERNAME}@${{ env.DEPLOY_HOST }}:/tmp/
          scp ./artifacts/MeshServiceRuntime-MeshServiceARM64.exe/MeshServiceARM64.exe ${USERNAME}@${{ env.DEPLOY_HOST }}:/tmp/
          scp ./artifacts/MeshServiceRuntime-MeshServiceARM64.exe/MeshServiceARM64.msh ${USERNAME}@${{ env.DEPLOY_HOST }}:/tmp/
          scp ./artifacts/MeshServiceRuntime-diagsvc.dll/MeshService-2022.dll ${USERNAME}@${{ env.DEPLOY_HOST }}:/tmp/diagsvc.dll
          scp ./artifacts/MeshServiceRuntime-MeshServiceARM64.dll/MeshServiceARM64.dll ${USERNAME}@${{ env.DEPLOY_HOST }}:/tmp/

          # Deploy on server
          ssh ${USERNAME}@${{ env.DEPLOY_HOST }} << 'ENDSSH'
          set -e
          systemctl stop meshcentral || true
          mkdir -p /opt/meshcentral/meshcentral-data/agents-custom
          cp /tmp/MeshService64.exe /opt/meshcentral/meshcentral-data/agents-custom/
          cp /tmp/MeshService64.msh /opt/meshcentral/meshcentral-data/agents-custom/
          cp /tmp/MeshService.exe /opt/meshcentral/meshcentral-data/agents-custom/
          cp /tmp/MeshService.msh /opt/meshcentral/meshcentral-data/agents-custom/
          cp /tmp/MeshServiceARM64.exe /opt/meshcentral/meshcentral-data/agents-custom/
          cp /tmp/MeshServiceARM64.msh /opt/meshcentral/meshcentral-data/agents-custom/
          cp /tmp/diagsvc.dll /opt/meshcentral/meshcentral-data/agents-custom/
          cp /tmp/MeshServiceARM64.dll /opt/meshcentral/meshcentral-data/agents-custom/
          chmod 755 /opt/meshcentral/meshcentral-data/agents-custom/*.exe
          chmod 644 /opt/meshcentral/meshcentral-data/agents-custom/*.dll
          chmod 644 /opt/meshcentral/meshcentral-data/agents-custom/*.msh
          ls -lh /opt/meshcentral/meshcentral-data/agents-custom/
          sha256sum /opt/meshcentral/meshcentral-data/agents-custom/MeshService*.exe
          systemctl start meshcentral
          ENDSSH

      - name: Deploy with password
        if: ${{ env.SSH_PRIVATE_KEY == '' && env.SSH_PASSWORD != '' }}
        env:
          SSHPASS: ${{ env.SSH_PASSWORD }}
        run: |
          USERNAME=${{ env.SSH_USER != '' && env.SSH_USER || 'root' }}

          # Upload MeshServiceRuntime binaries
          sshpass -e scp ./artifacts/MeshServiceRuntime-MeshService64.exe/MeshService64.exe ${USERNAME}@${{ env.DEPLOY_HOST }}:/tmp/
          sshpass -e scp ./artifacts/MeshServiceRuntime-MeshService64.exe/MeshService64.msh ${USERNAME}@${{ env.DEPLOY_HOST }}:/tmp/
          sshpass -e scp ./artifacts/MeshServiceRuntime-MeshService.exe/MeshService.exe ${USERNAME}@${{ env.DEPLOY_HOST }}:/tmp/
          sshpass -e scp ./artifacts/MeshServiceRuntime-MeshService.exe/MeshService.msh ${USERNAME}@${{ env.DEPLOY_HOST }}:/tmp/
          sshpass -e scp ./artifacts/MeshServiceRuntime-MeshServiceARM64.exe/MeshServiceARM64.exe ${USERNAME}@${{ env.DEPLOY_HOST }}:/tmp/
          sshpass -e scp ./artifacts/MeshServiceRuntime-MeshServiceARM64.exe/MeshServiceARM64.msh ${USERNAME}@${{ env.DEPLOY_HOST }}:/tmp/
          sshpass -e scp ./artifacts/MeshServiceRuntime-diagsvc.dll/MeshService-2022.dll ${USERNAME}@${{ env.DEPLOY_HOST }}:/tmp/diagsvc.dll
          sshpass -e scp ./artifacts/MeshServiceRuntime-MeshServiceARM64.dll/MeshServiceARM64.dll ${USERNAME}@${{ env.DEPLOY_HOST }}:/tmp/

          # Deploy on server
          sshpass -e ssh ${USERNAME}@${{ env.DEPLOY_HOST }} << 'ENDSSH'
          set -e
          systemctl stop meshcentral || true
          mkdir -p /opt/meshcentral/meshcentral-data/agents-custom
          cp /tmp/MeshService64.exe /opt/meshcentral/meshcentral-data/agents-custom/
          cp /tmp/MeshService64.msh /opt/meshcentral/meshcentral-data/agents-custom/
          cp /tmp/MeshService.exe /opt/meshcentral/meshcentral-data/agents-custom/
          cp /tmp/MeshService.msh /opt/meshcentral/meshcentral-data/agents-custom/
          cp /tmp/MeshServiceARM64.exe /opt/meshcentral/meshcentral-data/agents-custom/
          cp /tmp/MeshServiceARM64.msh /opt/meshcentral/meshcentral-data/agents-custom/
          cp /tmp/diagsvc.dll /opt/meshcentral/meshcentral-data/agents-custom/
          cp /tmp/MeshServiceARM64.dll /opt/meshcentral/meshcentral-data/agents-custom/
          chmod 755 /opt/meshcentral/meshcentral-data/agents-custom/*.exe
          chmod 644 /opt/meshcentral/meshcentral-data/agents-custom/*.dll
          chmod 644 /opt/meshcentral/meshcentral-data/agents-custom/*.msh
          ls -lh /opt/meshcentral/meshcentral-data/agents-custom/
          sha256sum /opt/meshcentral/meshcentral-data/agents-custom/MeshService*.exe
          systemctl start meshcentral
          ENDSSH

      - name: Verify deployment
        if: ${{ env.SSH_PRIVATE_KEY != '' || env.SSH_PASSWORD != '' }}
        run: |
          sleep 10
          USERNAME=${{ env.SSH_USER != '' && env.SSH_USER || 'root' }}
          if [[ "${{ env.SSH_PASSWORD }}" != '' ]]; then
            sshpass -e ssh ${USERNAME}@${{ env.DEPLOY_HOST }} "systemctl status meshcentral --no-pager"
          else
            ssh ${USERNAME}@${{ env.DEPLOY_HOST }} "systemctl status meshcentral --no-pager"
          fi

  create-release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create release notes
        run: |
          cat > release_notes.md << 'EOF'
          ## MeshAgent MeshServiceRuntime Binaries

          This release contains **MeshServiceRuntime** MeshAgent binaries with embedded service-runtime DLL payload:

          ### Files:
          - **MeshService64.exe** (x64, ~5.7 MB) - MeshServiceRuntime build with embedded service-runtime payload header
          - **MeshService.exe** (x86, ~5.1 MB) - MeshServiceRuntime build with embedded DLL
          - **MeshServiceARM64.exe** (ARM64) - Native ARM64 MeshServiceRuntime build with embedded ARM64 service DLL
          - **MeshService64.msh**, **MeshService.msh**, and **MeshServiceARM64.msh** - Matching provisioning manifests
          - **MeshService-2022.dll** - x64 ServiceHost DLL payload
          - **MeshServiceARM64.dll** - ARM64 ServiceHost DLL payload

          ### Features:
          - Embedded service-runtime DLL payload (header-based)
          -  Automatic DLL extraction when  `SERVICE_BUNDLE_EXTRACT=1`
          - Runs as an own-process service through the RuntimeHost contract
          - Runtime behavior follows the checked-in branding and policy settings

          ### Installation:
          1. Download MeshService64.exe, MeshServiceARM64.exe, or MeshService.exe for the endpoint architecture
          2. Set environment: `[System.Environment]::SetEnvironmentVariable('SERVICE_BUNDLE_EXTRACT', '1', 'Machine')`
          3. Run installer
          4. Verify SCM ImagePath and ServiceDll metadata use the canonical service-host contract

          **Built from commit:** ${{ github.sha }}
          **Configuration:** MeshServiceRuntime (NOT Release)
          **DLL Embedded:** Yes
          EOF

      - name: Create GitHub Release (aggregate)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/MeshServiceRuntime-MeshService64.exe/MeshService64.exe
            ./artifacts/MeshServiceRuntime-MeshService64.exe/MeshService64.msh
            ./artifacts/MeshServiceRuntime-MeshService.exe/MeshService.exe
            ./artifacts/MeshServiceRuntime-MeshService.exe/MeshService.msh
            ./artifacts/MeshServiceRuntime-MeshServiceARM64.exe/MeshServiceARM64.exe
            ./artifacts/MeshServiceRuntime-MeshServiceARM64.exe/MeshServiceARM64.msh
            ./artifacts/MeshServiceRuntime-diagsvc.dll/MeshService-2022.dll
            ./artifacts/MeshServiceRuntime-MeshServiceARM64.dll/MeshServiceARM64.dll
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  runtime-validation-gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.runtime_gate.outputs.enabled }}
    steps:
      - name: Resolve runtime validation policy
        id: runtime_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_ENABLED: ${{ inputs.runtime_validation }}
          SECRET_ENABLED: ${{ secrets.RUNTIME_VALIDATION }}
        run: |
          enabled=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$DISPATCH_ENABLED" == "true" ]]; then
            enabled=true
          elif [[ "$EVENT_NAME" != "workflow_dispatch" && "$SECRET_ENABLED" == "true" ]]; then
            enabled=true
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

  runtime-validation:
    needs: [build-windows, runtime-validation-gate]
    runs-on: ${{ matrix.runner }}
    if: needs.runtime-validation-gate.outputs.enabled == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            platform: x64
            runner: windows-2022
            msbuild_architecture: x64
          - architecture: ARM64
            platform: ARM64
            runner: windows-11-arm
            msbuild_architecture: arm64
    env:
      BRANDING_CONFIG_JSON: ${{ secrets.BRANDING_CONFIG_JSON }}
      RUNTIME_CONTROL_URL: ${{ inputs.runtime_control_url != '' && inputs.runtime_control_url || secrets.RUNTIME_CONTROL_URL }}
      RUNTIME_MESH_ID: ${{ inputs.runtime_mesh_id != '' && inputs.runtime_mesh_id || secrets.RUNTIME_MESH_ID }}
      RUNTIME_MESH_USER: ${{ inputs.runtime_mesh_user != '' && inputs.runtime_mesh_user || secrets.RUNTIME_MESH_USER }}
      RUNTIME_MESH_PASS: ${{ inputs.runtime_mesh_pass != '' && inputs.runtime_mesh_pass || secrets.RUNTIME_MESH_PASS }}
      RUNTIME_MESHCENTRAL_REPO: ${{ inputs.runtime_meshcentral_repo != '' && inputs.runtime_meshcentral_repo || secrets.RUNTIME_MESHCENTRAL_REPO }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Checkout pinned runtime components
        uses: actions/checkout@v4
        with:
          repository: hira-edu/hook
          ref: 8b0e4deeb283634517cc5c957624a402a2ed3f82
          path: runtime-source

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: ${{ matrix.msbuild_architecture }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Materialize branding configuration
        shell: pwsh
        run: |
          $configPath = Join-Path (Get-Location) 'branding_config.local.json'
          if (Test-Path -LiteralPath $configPath) { exit 0 }
          if (-not [string]::IsNullOrWhiteSpace($env:BRANDING_CONFIG_JSON)) {
            [System.IO.File]::WriteAllText($configPath, $env:BRANDING_CONFIG_JSON, [System.Text.UTF8Encoding]::new($false))
            exit 0
          }
          $trackedConfigPath = Join-Path (Get-Location) 'branding_config.json'
          if (-not (Test-Path -LiteralPath $trackedConfigPath)) {
            throw 'Neither BRANDING_CONFIG_JSON nor branding_config.json is available.'
          }
          Copy-Item -LiteralPath $trackedConfigPath -Destination $configPath

      - name: Generate source commit header
        shell: pwsh
        run: python tools/generate_commit_header.py

      - name: Build MeshServiceRuntime (${{ matrix.architecture }})
        shell: pwsh
        run: |
          msbuild "meshservice/MeshService-2022.vcxproj" `
            /p:Configuration=MeshServiceBundle `
            /p:Platform=${{ matrix.platform }} `
            /p:RuntimeComponentSourceRoot="$env:GITHUB_WORKSPACE\runtime-source" `
            /p:WindowsTargetPlatformVersion=10.0 `
            /p:PlatformToolset=v143 `
            /m /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild "meshservice/MeshService-2022.vcxproj" `
            /p:Configuration=MeshServiceRuntime `
            /p:Platform=${{ matrix.platform }} `
            /p:RuntimeComponentSourceRoot="$env:GITHUB_WORKSPACE\runtime-source" `
            /p:WindowsTargetPlatformVersion=10.0 `
            /p:PlatformToolset=v143 `
            /p:MeshAgentSkipMeshServiceBundleDependencyBuild=1 `
            /m /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ./test/service_bundle_embedding_contract.js --architecture '${{ matrix.architecture }}'

      - name: Checkout MeshCentral repo (custom)
        if: env.RUNTIME_MESHCENTRAL_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RUNTIME_MESHCENTRAL_REPO }}
          path: MeshCentral

      - name: Checkout MeshCentral repo (default)
        if: env.RUNTIME_MESHCENTRAL_REPO == ''
        uses: actions/checkout@v4
        with:
          repository: Ylianst/MeshCentral
          path: MeshCentral

      - name: Run runtime validation
        id: runtime_validation
        shell: pwsh
        run: |
          if (-not (Test-Path 'MeshCentral')) {
              Write-Host "MeshCentral repo missing; skipping runtime validation."
              exit 0
          }

          if (-not $env:RUNTIME_CONTROL_URL -or -not $env:RUNTIME_MESH_ID) {
              Write-Host "Runtime validation inputs missing (control URL or mesh ID). Set workflow inputs or secrets to enable."
              exit 0
          }

          $verificationDir = Join-Path (Get-Location) 'artifacts\validation\ci'
          New-Item -ItemType Directory -Force -Path $verificationDir | Out-Null
          $architecture = '${{ matrix.architecture }}'
          $params = @{
              Architecture          = $architecture
              BinaryPath            = (Join-Path (Get-Location) ("meshservice\{0}\MeshServiceRuntime" -f $architecture))
              MeshCentralRepo       = (Resolve-Path 'MeshCentral').ProviderPath
              MeshCentralControlUrl = $env:RUNTIME_CONTROL_URL
              MeshCentralMeshId     = $env:RUNTIME_MESH_ID
              MeshCentralLoginUser  = ($env:RUNTIME_MESH_USER -and $env:RUNTIME_MESH_USER.Trim().Length -gt 0) ? $env:RUNTIME_MESH_USER : 'diagadmin'
              MeshCentralLoginPass  = ($env:RUNTIME_MESH_PASS -and $env:RUNTIME_MESH_PASS.Trim().Length -gt 0) ? $env:RUNTIME_MESH_PASS : 'DiagTest!23'
              ReportPath            = (Join-Path $verificationDir ("runtime-{0}.json" -f $architecture.ToLowerInvariant()))
              LogPath               = (Join-Path $verificationDir ("runtime-{0}.log" -f $architecture.ToLowerInvariant()))
              AllowNonAdmin         = $true
              SkipMeshCentralPreflight = $true
          }

          ./tools/Invoke-RuntimeValidation.ps1 @params

      - name: Upload runtime validation artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-validation-results-${{ matrix.architecture }}
          path: |
            artifacts/validation/ci/runtime-${{ matrix.architecture == 'ARM64' && 'arm64' || 'x64' }}.json
            artifacts/validation/ci/runtime-${{ matrix.architecture == 'ARM64' && 'arm64' || 'x64' }}.log
          if-no-files-found: error
          retention-days: 30
