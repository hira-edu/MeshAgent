name: Request coordinated release
# A push to main (production channel) or preview (preview channel) asks hira-edu/hook for one coordinated
# release of that channel. hook resolves MeshCentral and hook to the same channel's branch, builds, pins,
# smoke-tests and, for preview, deploys; production deploys only from an operator's manual run in hook.
on:
  push:
    branches: [main, preview]
  pull_request:
    branches: [main, preview]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: request-coordinated-release-${{ github.event_name == 'pull_request' && github.ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify deployment failure handling without production credentials
        run: |
          python -m unittest discover -s test -p 'ci_release*_test.py' -v
          python test/windows_ci_inputs_contract.py
          python test/deploy_windows_architecture_contract.py
          python test/deploy_windows_bundle_matrix_contract.py
          python test/deploy_transport_health_runtime.py
  dispatch:
    needs: validate
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preview') &&
      github.event.repository.default_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the release app credential
        env:
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY_SET: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$RELEASE_APP_ID" ] || [ "$RELEASE_APP_PRIVATE_KEY_SET" != true ]; then
            echo "::error title=Release dispatch::Set repository variable RELEASE_APP_ID and repository secret RELEASE_APP_PRIVATE_KEY (the release app, installed on hook) to request the coordinated release"
            exit 1
          fi
      - name: Create a short-lived dispatch token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: hook
          permission-contents: write
      - name: Request release from this exact source commit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          COORDINATOR: ${{ github.repository_owner }}/hook
        run: |
          python - <<'PY' > request.json
          import json, os
          print(json.dumps({'event_type': 'sibling-source-updated', 'client_payload': {
              'repository': os.environ['GITHUB_REPOSITORY'], 'sha': os.environ['GITHUB_SHA'],
              'branch': os.environ['GITHUB_REF_NAME']}}))
          PY
          gh api --method POST "repos/$COORDINATOR/dispatches" --input request.json
